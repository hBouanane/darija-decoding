# Decoding settings for exploration runs.
# Every prompt version is generated once per setting.

system_prompt: null      # no system prompt: see the model's raw behavior
enable_thinking: false   # Gemma 4 and Qwen3.5 can reason first; we want the direct answer
# A cap, not a target: short answers stop on their own. No "be brief"
# instruction, since that would change the style we're trying to observe.
max_new_tokens: 512
seed: 42

settings:
  greedy:
    do_sample: false
  sampled:
    do_sample: true
    temperature: 0.7
    top_p: 0.9
    top_k: 0             # off; otherwise the model's own default (e.g. 64) applies

# Alternatives saved for every generated token. Probabilities come from the
# raw model output, before temperature/top_p, so greedy and sampled compare.
top_k_logged: 10
